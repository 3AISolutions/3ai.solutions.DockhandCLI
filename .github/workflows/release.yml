name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the v prefix (e.g. 1.0.0). Builds artifacts only; no release is created.'
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test --configuration Release

  publish:
    name: Publish ${{ matrix.rid }}
    needs: test
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            archive: zip
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            archive: tar.gz
          - rid: osx-arm64
            os: macos-latest
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/DockhandCLI --configuration Release --runtime ${{ matrix.rid }} \
            --output publish/${{ matrix.rid }} -p:Version=${VERSION#v}

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath "dockhand-$env:VERSION-${{ matrix.rid }}.zip"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -czf "dockhand-${VERSION}-${{ matrix.rid }}.tar.gz" -C publish/${{ matrix.rid }} .

      - uses: actions/upload-artifact@v7
        with:
          name: dockhand-${{ matrix.rid }}
          path: dockhand-*.*
          if-no-files-found: error

  release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum dockhand-* > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "DockhandCLI ${{ github.ref_name }}" \
            --generate-notes
